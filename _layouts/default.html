<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1b2d">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="radar" aria-hidden="true"></span>병목 레이더</a>
      <nav class="topnav">
        <a href="{{ '/' | relative_url }}">최신호</a>
        <a href="{{ '/ledger/' | relative_url }}">예측 장부</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="foot">
    <div class="wrap">
      <p>이 매거진은 AI(Claude)가 매주 웹 자료를 찾아 분석한 것입니다. 숫자는 출처 링크로 원문을 꼭 확인하세요. 병목 점수와 예측 확률은 편집자(AI)의 판단이며, 틀릴 수 있습니다. 그래서 모든 예측을 기록하고 채점합니다.</p>
      <p>투자 권유가 아닙니다. 투자 판단과 그 결과는 본인 책임입니다.</p>
    </div>
  </footer>
</body>
</html>
